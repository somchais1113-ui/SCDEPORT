<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Portfolio Preview | Somchai Sompiew</title>
    <style>
      :root {
        --preview-width: 1440px;
        --ink: #1b1c1a;
        --panel: #2a2b28;
        --line: #42433f;
        --muted: #b6b7b1;
        --accent: #85897e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: white;
        font-family: Arial, "Noto Sans Thai", sans-serif;
      }

      button,
      select,
      a {
        color: inherit;
        font: inherit;
      }

      .preview-bar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: grid;
        grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
        align-items: center;
        gap: 18px;
        min-height: 68px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(21, 21, 21, 0.96);
        backdrop-filter: blur(14px);
      }

      .preview-title strong,
      .preview-title span {
        display: block;
      }

      .preview-title strong {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .preview-title span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }

      .viewport-switcher {
        display: flex;
        gap: 5px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
      }

      .viewport-switcher button {
        padding: 8px 13px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .viewport-switcher button[aria-pressed="true"] {
        background: white;
        color: #111;
      }

      .preview-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .preview-actions select,
      .preview-actions a {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        font-size: 11px;
      }

      .preview-actions select {
        max-width: 210px;
        padding: 0 34px 0 13px;
      }

      .preview-actions a {
        display: inline-flex;
        align-items: center;
        padding: 0 14px;
        background: var(--accent);
        text-decoration: none;
      }

      .preview-stage {
        display: flex;
        min-height: calc(100vh - 68px);
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
        padding: 26px;
        background:
          linear-gradient(45deg, #20211f 25%, transparent 25%) 0 0 / 20px 20px,
          linear-gradient(-45deg, #20211f 25%, transparent 25%) 0 0 / 20px 20px,
          linear-gradient(45deg, transparent 75%, #20211f 75%) 0 0 / 20px 20px,
          linear-gradient(-45deg, transparent 75%, #20211f 75%) 0 0 / 20px 20px,
          #242522;
      }

      .preview-window {
        width: var(--preview-width);
        flex: 0 0 var(--preview-width);
        overflow: hidden;
        border: 1px solid #464646;
        border-radius: 9px;
        background: white;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        transition: width 220ms ease, flex-basis 220ms ease;
      }

      .browser-top {
        display: flex;
        height: 34px;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-bottom: 1px solid #ddd;
        background: #f3f3f3;
      }

      .browser-top span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bbb;
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 154px);
        min-height: 680px;
        border: 0;
        background: white;
      }

      @media (max-width: 800px) {
        .preview-bar {
          grid-template-columns: 1fr auto;
        }

        .viewport-switcher {
          display: none;
        }

        .preview-actions select {
          max-width: 155px;
        }

        .preview-actions a {
          display: none;
        }

        .preview-stage {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="preview-bar">
      <div class="preview-title">
        <strong>Somchai Sompiew / Portfolio Preview</strong>
        <span>Preview tool only. This page is not part of the public navigation.</span>
      </div>

      <div class="viewport-switcher" role="group" aria-label="Preview viewport">
        <button type="button" data-width="1440" aria-pressed="true">Desktop</button>
        <button type="button" data-width="768" aria-pressed="false">Tablet</button>
        <button type="button" data-width="390" aria-pressed="false">Mobile</button>
      </div>

      <div class="preview-actions">
        <label>
          <span hidden>Choose preview page</span>
          <select id="page-select" aria-label="Choose preview page">
            <option value="index.html">Landing page</option>
            <option value="home.html">Portfolio / All work</option>
          </select>
        </label>
        <a id="open-page" href="index.html" target="_blank" rel="noopener">Open page ↗</a>
      </div>
    </header>

    <main class="preview-stage">
      <div class="preview-window">
        <div class="browser-top" aria-hidden="true"><span></span><span></span><span></span></div>
        <iframe id="preview-frame" src="index.html" title="Portfolio website preview"></iframe>
      </div>
    </main>

    <script src="data/categories.js"></script>
    <script src="data/projects.js"></script>
    <script src="assets/js/shared.js"></script>
    <script>
      (function () {
        "use strict";

        const root = document.documentElement;
        const frame = document.querySelector("#preview-frame");
        const pageSelect = document.querySelector("#page-select");
        const openPage = document.querySelector("#open-page");
        const viewportButtons = document.querySelectorAll("[data-width]");
        const portfolio = window.SomchaiPortfolio;

        if (portfolio) {
          portfolio.projects.forEach(function (project) {
            const category = portfolio.categoryById(project.category);
            const option = document.createElement("option");
            option.value = "project.html?id=" + encodeURIComponent(project.slug);
            option.textContent = `${category ? category.label : project.sector} / ${project.title}`;
            pageSelect.append(option);
          });
        }

        viewportButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            root.style.setProperty("--preview-width", button.dataset.width + "px");
            viewportButtons.forEach(function (item) {
              item.setAttribute("aria-pressed", String(item === button));
            });
          });
        });

        pageSelect.addEventListener("change", function () {
          frame.src = pageSelect.value;
          openPage.href = pageSelect.value;
        });
      })();
    </script>
  </body>
</html>
