<svg viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-stage workflow pipeline from brief to delivery">
  <rect width="1440" height="1080" fill="#ffffff"/>

  <!-- connecting line -->
  <line x1="220" y1="540" x2="1220" y2="540" stroke="rgba(27,28,26,0.16)" stroke-width="1.4"/>

  <!-- 5 stage nodes -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- stage 1 -->
    <circle cx="220" cy="540" r="46" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.6"/>
    <text x="220" y="551" text-anchor="middle" font-size="26" fill="#1b1c1a">01</text>
    <rect x="150" y="640" width="140" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
    <rect x="170" y="662" width="100" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>

    <!-- stage 2 -->
    <circle cx="470" cy="540" r="46" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.6"/>
    <text x="470" y="551" text-anchor="middle" font-size="26" fill="#1b1c1a">02</text>
    <rect x="400" y="640" width="140" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
    <rect x="420" y="662" width="100" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>

    <!-- stage 3 -->
    <circle cx="720" cy="540" r="46" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.6"/>
    <text x="720" y="551" text-anchor="middle" font-size="26" fill="#1b1c1a">03</text>
    <rect x="650" y="640" width="140" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
    <rect x="670" y="662" width="100" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>

    <!-- stage 4 -->
    <circle cx="970" cy="540" r="46" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.6"/>
    <text x="970" y="551" text-anchor="middle" font-size="26" fill="#1b1c1a">04</text>
    <rect x="900" y="640" width="140" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
    <rect x="920" y="662" width="100" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>

    <!-- stage 5 -->
    <circle cx="1220" cy="540" r="46" fill="#1b1c1a" stroke="#1b1c1a" stroke-width="1.6"/>
    <text x="1220" y="551" text-anchor="middle" font-size="26" fill="#ffffff">05</text>
    <rect x="1150" y="640" width="140" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
    <rect x="1170" y="662" width="100" height="10" rx="5" fill="rgba(27,28,26,0.10)"/>
  </g>

  <!-- arrows between nodes -->
  <g stroke="#1b1c1a" stroke-width="1.4" fill="none">
    <path d="M270 540 L400 540" marker-end="url(#arrow)"/>
    <path d="M520 540 L650 540" marker-end="url(#arrow)"/>
    <path d="M770 540 L900 540" marker-end="url(#arrow)"/>
    <path d="M1020 540 L1150 540" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1b1c1a"/>
    </marker>
  </defs>
</svg>
