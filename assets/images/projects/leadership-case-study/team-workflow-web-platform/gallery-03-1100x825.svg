<svg viewBox="0 0 1100 825" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract panel representing conversion, satisfaction and revenue impact trending upward">
  <rect width="1100" height="825" fill="#ffffff"/>

  <!-- baseline -->
  <line x1="140" y1="620" x2="960" y2="620" stroke="rgba(27,28,26,0.16)" stroke-width="1.4"/>

  <!-- three upward indicators -->
  <g stroke="#1b1c1a" stroke-width="1.6" fill="none">
    <!-- indicator 1 -->
    <path d="M220 560 L220 420" marker-end="url(#arrowUp)"/>
    <circle cx="220" cy="560" r="5" fill="#1b1c1a" stroke="none"/>
    <rect x="180" y="640" width="80" height="8" rx="4" fill="rgba(27,28,26,0.10)" stroke="none"/>

    <!-- indicator 2 (tallest, centre) -->
    <path d="M550 590 L550 320" marker-end="url(#arrowUp)"/>
    <circle cx="550" cy="590" r="5" fill="#1b1c1a" stroke="none"/>
    <rect x="500" y="640" width="100" height="8" rx="4" fill="rgba(27,28,26,0.10)" stroke="none"/>

    <!-- indicator 3 -->
    <path d="M880 540 L880 380" marker-end="url(#arrowUp)"/>
    <circle cx="880" cy="540" r="5" fill="#1b1c1a" stroke="none"/>
    <rect x="840" y="640" width="80" height="8" rx="4" fill="rgba(27,28,26,0.10)" stroke="none"/>
  </g>

  <!-- faint connecting trend line across the three -->
  <path d="M220 480 Q 385 400 550 340 Q 715 380 880 400" stroke="rgba(27,28,26,0.16)" stroke-width="1.2" fill="none"/>

  <defs>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="3" refY="0" orient="auto" markerUnits="strokeWidth">
      <path d="M0,6 L3,0 L6,6 z" fill="#1b1c1a"/>
    </marker>
  </defs>
</svg>
