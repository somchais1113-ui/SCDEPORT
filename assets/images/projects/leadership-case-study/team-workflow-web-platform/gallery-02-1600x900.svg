<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wide abstract kanban board representing the team's task pipeline">
  <rect width="1600" height="900" fill="#f4f4f2"/>

  <g stroke="rgba(27,28,26,0.16)" stroke-width="1.2">
    <line x1="360" y1="90" x2="360" y2="810"/>
    <line x1="680" y1="90" x2="680" y2="810"/>
    <line x1="1000" y1="90" x2="1000" y2="810"/>
    <line x1="1320" y1="90" x2="1320" y2="810"/>
  </g>

  <g fill="rgba(27,28,26,0.10)" stroke="#1b1c1a" stroke-width="1.3">
    <!-- column 1 -->
    <rect x="90" y="90" width="220" height="34" rx="4" fill="#1b1c1a" stroke="none"/>
    <rect x="90" y="150" width="220" height="90" rx="4"/>
    <rect x="90" y="256" width="220" height="130" rx="4"/>
    <rect x="90" y="402" width="220" height="70" rx="4"/>

    <!-- column 2 -->
    <rect x="410" y="90" width="220" height="34" rx="4" fill="#1b1c1a" stroke="none"/>
    <rect x="410" y="150" width="220" height="150" rx="4"/>
    <rect x="410" y="316" width="220" height="90" rx="4"/>

    <!-- column 3 -->
    <rect x="730" y="90" width="220" height="34" rx="4" fill="#1b1c1a" stroke="none"/>
    <rect x="730" y="150" width="220" height="70" rx="4"/>
    <rect x="730" y="236" width="220" height="70" rx="4"/>
    <rect x="730" y="322" width="220" height="70" rx="4"/>

    <!-- column 4 -->
    <rect x="1050" y="90" width="220" height="34" rx="4" fill="#1b1c1a" stroke="none"/>
    <rect x="1050" y="150" width="220" height="110" rx="4"/>

    <!-- column 5 -->
    <rect x="1370" y="90" width="140" height="34" rx="4" fill="#1b1c1a" stroke="none"/>
    <rect x="1370" y="150" width="140" height="90" rx="4"/>
    <rect x="1370" y="256" width="140" height="90" rx="4"/>
  </g>
</svg>
